// prediction (aligned orientation) and reference side by side, turning together, as in the header
const S=0.6;
function side(st,X,pos){const W_=new THREE.Group(),Sp=new THREE.Group(),In=new THREE.Group();In.scale.setScalar(S);W_.add(Sp);Sp.add(In);W_.position.copy(pos);scene.add(W_);

// turning axis: the reference's long axis (principal direction of its atoms), so the two never sweep into each other
const AX=(()=>{const X=DATA.ref.X,c=X.reduce((a,p)=>a.map((v,k)=>v+p[k]/X.length),[0,0,0]),C=[[0,0,0],[0,0,0],[0,0,0]];
  X.forEach(p=>{const d=p.map((v,k)=>v-c[k]);for(let i=0;i<3;i++)for(let j=0;j<3;j++)C[i][j]+=d[i]*d[j]});
  let v=[1,0.3,0.2];for(let it=0;it<60;it++){v=C.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);const n=Math.hypot(...v);v=v.map(x=>x/n)}return new THREE.Vector3(...v)})();

const Z=new THREE.Vector3();
// geometric patterns (all real: matched pairs, nearest neighbours both ways, worst neighbour per species, transport plan)
const mk=(list,o)=>list.map(([p,g,x])=>({p,g,x,l:fatLine(Z,Z,typeof o==='function'?o(x):o)}));
const pat={
  rmse:mk(GEO.rmse,{color:0x6b7280,linewidth:2.2,dashed:true,dashSize:0.16,gapSize:0.12}),
  chamfer:mk(GEO.chamfer,d=>({color:d?0xaab2bc:0x4b5563,linewidth:2.0})),
  hausBase:mk(GEO.chamfer,{color:0xc4cad3,linewidth:1.6}),
  haus:mk(GEO.hausdorff,{color:0x4b5563,linewidth:4.5}),
  sink:mk(GEO.sinkhorn,w=>({color:0xaab2bc,linewidth:1.2+2.4*w})),
};
const dotM=new THREE.MeshBasicMaterial({color:DARK,transparent:true,opacity:0,depthTest:false}), dotG=new THREE.SphereGeometry(0.08,12,8);
const dots=GEO.sinkhorn.flatMap(([p,g])=>[0,1/3,2/3].map(ph=>{const m=new THREE.Mesh(dotG,dotM);m.renderOrder=8;scene.add(m);return {m,p,g,ph}}));
// physical visuals
const XA={x0:-12.0,x1:-0.4,y0:-5.5,h:2.5};
const xmax=Math.max(...DATA.xrd[0],...DATA.xrd[1]);
const xrdL=DATA.xrd.map((ys,k)=>{const g=new LineGeometry();g.setPositions(ys.flatMap((y,i)=>[XA.x0+(XA.x1-XA.x0)*i/(ys.length-1),XA.y0+XA.h*y/xmax,0]));
  const l=new Line2(g,fat({color:k?0x4b5563:0xaab2bc,linewidth:1.8}));l.renderOrder=6;scene.add(l);return l});

const dens=[PL,PR].map((P,k)=>{const fr=flat(new THREE.Mesh(new THREE.ShapeGeometry((()=>{const s=roundRect(BW,BH,0.2);s.holes.push(new THREE.Path(roundRect(BW-0.12,BH-0.12,0.14).getPoints(16).reverse()));return s})(),12),
    new THREE.MeshBasicMaterial({color:GRAY,transparent:true,opacity:0,depthTest:false})));fr.position.set(P.x,-4.15,0);fr.renderOrder=6;scene.add(fr);
  const fg=new THREE.PlaneGeometry(BW-0.24,1);fg.translate(0,0.5,0);const fill=flat(new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:k?'#8b95a1':'#c4cad3',transparent:true,opacity:0,depthTest:false})));
  fill.position.set(P.x,-4.15-BH/2+0.12,0);fill.renderOrder=5;scene.add(fill);return {fr,fill,h:(BH-0.24)*DATA.rho[k]/rhoMax}});

const pdIdx=DATA.pred.spp.slice(0,DATA.pred.n).indexOf('Pd'), pdRef=DATA.ref.spp.slice(0,DATA.ref.n).indexOf('Pd');
const soap=[[prIn,DATA.ghost[pdIdx]],[refIn,DATA.ref.X[pdRef]]].map(([g,c])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(4.0,40,28),new THREE.MeshBasicMaterial({color:'#8b95a1',transparent:true,opacity:0,depthWrite:false}));
  m.position.set(...c);m.renderOrder=4;g.add(m);return m});
const inside=(X,c)=>X.map(p=>Math.hypot(p[0]-c[0],p[1]-c[1],p[2]-c[2])<=4.0);
const inPr=inside(DATA.ghost,DATA.ghost[pdIdx]), inRef=inside(DATA.ref.X,DATA.ref.X[pdRef]);
// energy: two levels on a vertical axis (the stored metric is |ΔE|; the prediction is drawn above)
const EX=-5.65, E0=-5.4, E1=-3.0, axM=new THREE.LineBasicMaterial({color:GRAY,transparent:true,opacity:0,depthTest:false});
const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(EX,E0-0.3,0),new THREE.Vector3(EX,E1+0.5,0)]),axM); axis.renderOrder=6; scene.add(axis);
const eHi=E1, eLo=E0, levels=[[EX-2.6,EX-0.4,eHi,0xaab2bc],[EX+0.4,EX+2.6,eLo,0x4b5563]].map(([a,b,y,c])=>fatLine(V3(a,y),V3(b,y),{color:c,linewidth:4,world:true}));
const gap=fatLine(V3(EX,eLo),V3(EX,eHi),{color:0x6b7280,linewidth:2,dashed:true,dashSize:0.14,gapSize:0.1,world:true});
function V3(x,y){return new THREE.Vector3(x,y,0)}
// each physical visual gathers into its value, as the geometric lines do
const xrdG=new THREE.Group(), densG=new THREE.Group(), enG=new THREE.Group(); [xrdG,densG,enG].forEach(g=>scene.add(g));
xrdL.forEach(l=>xrdG.add(l)); dens.forEach(d=>densG.add(d.fr,d.fill)); enG.add(axis,...levels,gap);
const CEN={xrd:V3((XA.x0+XA.x1)/2,XA.y0+XA.h/2), dens:V3((PL.x+PR.x)/2,-4.15), en:V3(EX,(E0+E1)/2)};
function gather(g,c,row,f){const T_=V3(VX-0.9,ROWY[row]), s=1-0.92*f; g.scale.setScalar(s); g.position.copy(c).add(T_.sub(c).multiplyScalar(f)).sub(c.clone().multiplyScalar(s))}
const soapDisc=[0,1].map(()=>{const m=flat(new THREE.Mesh(new THREE.CircleGeometry(1,40),new THREE.MeshBasicMaterial({color:'#8b95a1',transparent:true,opacity:0,depthTest:false})));m.renderOrder=7;scene.add(m);return m});
// ---------- timeline
const T=31.5, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eo=t=>1-Math.pow(1-t,3), cl=t=>Math.min(1,Math.max(0,t));
const TA=1.6, TB=16.6, DM=3.2, TSPLIT=14.8; // starts of the geometric and physical passes, time per metric, separation
const win=(t,t0,a=0.4,b=2.7)=>cl((t-t0)/a)*(1-cl((t-t0-b)/0.4)); // a metric's own visual: in, hold, out
let urlT=new URLSearchParams(location.search).get('t'); const t0=performance.now();
function frame(now){
  if(!VIS&&urlT===null){requestAnimationFrame(frame);return}
  const t=urlT!==null?parseFloat(urlT):((now-t0)/1000)%T;
  const fout=1-cl((t-T+0.8)/0.7), fin=cl(t/0.8), sp=ease(cl((t-TSPLIT)/1.4)), aOut=1-cl((t-TSPLIT)/0.6), bIn=cl((t-TSPLIT-0.6)/0.6);
  cardMat.color.copy(WHITE).lerp(CARDC,fin*fout);
  // both structures turn together; polyhedra step back while the geometric lines are drawn
  const sw=0.3*t; PR_.Sp.quaternion.setFromAxisAngle(AX,sw); RF_.Sp.quaternion.setFromAxisAngle(AX,sw); scene.updateMatrixWorld(true);
  const polyOn=cl((t-TSPLIT)/1.0), sB=TB+2*DM, soapOn=cl((t-sB)/0.4)*(1-cl((t-sB-1.75)/0.6)), soapDim=1-0.65*soapOn;
  [[refMats,refIn,inRef,DATA.ref.X],[prMats,prIn,inPr,DATA.ghost]].forEach(([ms,g,ins,X])=>{
    ms.forEach(([m,o])=>op(m,o*fin*fout*(m.userData.poly?0.15+0.85*polyOn:1)));
    g.children.forEach((c,j)=>{if(j<X.length&&!ins[j])op(c.material,fin*fout*soapDim)})});
  // card rows: the active metric is dark; its value is produced by its lines and then stays
  ['A','B'].forEach(k=>rows[k].forEach((r,i)=>{const t0k=(k==='A'?TA:TB)+DM*i, vis=(k==='A'?fin*aOut:bIn)*fout, act=cl((t-t0k)/0.3)*(1-cl((t-t0k-DM+0.2)/0.3));
    r.name.material.opacity=vis*act; r.dimName.material.opacity=vis*(1-act);
    const v=cl((t-t0k-2.35)/0.3); r.val.material.opacity=vis*v; r.val.scale.setScalar(0.85+0.15*eo(v))}));
  // geometric patterns: lines grow between the two structures, hold, then gather into the metric's value
  const draw=(arr,t0k,o=1,fold=true)=>{const g=eo(cl((t-t0k-0.2)/0.8)), f=fold?ease(cl((t-t0k-1.75)/0.6)):0, out=fold?1:1-cl((t-t0k-1.75)/0.4), on=cl((t-t0k)/0.3)*out*(1-cl((t-t0k-2.3)/0.2));
    const T_=new THREE.Vector3(VX-0.9,ROWY[(t0k-TA)/DM|0],0);
    arr.forEach(e=>{const A=wp(prIn,DATA.ghost,e.p),B=wp(refIn,DATA.ref.X,e.g),b=A.clone().lerp(B,g);A.lerp(T_,f);b.lerp(T_,f);
      e.l.geometry.setPositions([A.x,A.y,A.z,b.x,b.y,b.z]);e.l.computeLineDistances();e.l.material.opacity=o*on*fout;e.l.visible=on>0.002})};
  draw(pat.rmse,TA); draw(pat.chamfer,TA+DM); draw(pat.hausBase,TA+2*DM,0.6,false); draw(pat.haus,TA+2*DM); draw(pat.sink,TA+3*DM);
  const so=cl((t-TA-3*DM-0.9)/0.3)*(1-cl((t-TA-3*DM-1.75)/0.3)); dotM.opacity=so*fout;
  dots.forEach(d=>{const u=((t*0.6+d.ph)%1);d.m.position.copy(wp(prIn,DATA.ghost,d.p)).lerp(wp(refIn,DATA.ref.X,d.g),u);d.m.visible=so>0});
  // physical visuals: drawn, held, then gathered into the value
  const pv=t0k=>({on:cl((t-t0k)/0.4)*(t<t0k+2.35?1:0), f:ease(cl((t-t0k-1.75)/0.6))});
  const X_=pv(TB); xrdL.forEach(l=>{l.material.opacity=X_.on*fout;l.visible=X_.on>0;l.geometry.instanceCount=Math.floor(399*cl((t-TB)/0.9))}); gather(xrdG,CEN.xrd,0,X_.f);
  const D_=pv(TB+DM); dens.forEach(d=>{d.fr.material.opacity=D_.on*fout;d.fill.material.opacity=D_.on*fout;d.fill.scale.y=Math.max(0.001,d.h*eo(cl((t-TB-DM-0.3)/1.0)))}); gather(densG,CEN.dens,1,D_.f);
  const S_=pv(sB); soap.forEach(m=>m.material.opacity=0.16*soapOn*fout);
  [[prIn,DATA.ghost[pdIdx]],[refIn,DATA.ref.X[pdRef]]].forEach(([g,c],k)=>{const d=soapDisc[k],P=g.localToWorld(new THREE.Vector3(...c));
    d.position.copy(P.lerp(V3(VX-0.9,ROWY[2]),S_.f)); d.scale.setScalar(4.0*S*(1-0.95*S_.f)); d.material.opacity=0.35*S_.on*(S_.f>0?1:0)*fout; d.visible=S_.f>0&&S_.on>0});
  const E_=pv(TB+3*DM); axM.opacity=E_.on*fout; levels.forEach(l=>{l.material.opacity=E_.on*fout;l.visible=E_.on>0});
