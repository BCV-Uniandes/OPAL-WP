// ---------- renderer / camera (fit by width)
const el=document.getElementById('view');
// draw only while visible; a lost WebGL context (too many on the page) reloads this frame
let VIS=true; new IntersectionObserver(e=>{VIS=e[0].isIntersecting}).observe(el);

const scene=new THREE.Scene(); scene.background=new THREE.Color('#ffffff');
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-100,100); cam.position.set(1.2,1.6,20); cam.lookAt(0,0,0);
const HW=12.3, VS=5.2; // tight around the lanes so boxes and structures read at the page size
function resize(){const w=el.clientWidth,h=el.clientHeight,a=w/h;ren.setSize(w,h);const hh=Math.max(HW/a,VS),hw=hh*a;cam.left=-hw;cam.right=hw;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix()}

scene.add(new THREE.AmbientLight(0xffffff,1.1));
const dl=new THREE.DirectionalLight(0xffffff,2.2); dl.position.set(8,12,14); scene.add(dl);
const fl=new THREE.DirectionalLight(0xffffff,0.6); fl.position.set(-10,-4,-8); scene.add(fl);
// ---------- helpers (same Crystal Toolkit look as the header)
const S=0.48;
const sph=new THREE.SphereGeometry(0.5,40,28), cyl=new THREE.CylinderGeometry(0.15,0.15,1,20), UP=new THREE.Vector3(0,1,0);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:0.28,metalness:0,transparent:false,opacity:1});
function op(m,o){m.opacity=o;const tr=o<0.999||!!m.userData.T;if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true}} // opaque unless fading, so translucent polyhedra blend over atoms consistently
function polyMeshes(P,X,c){ // faces wound outwards; back faces drawn before front faces
  const vs=[...new Set(P.faces.flat())],C=new THREE.Vector3();vs.forEach(v=>C.add(new THREE.Vector3(...X[v])));C.divideScalar(vs.length);
  const pos=[];P.faces.forEach(f=>{const A=new THREE.Vector3(...X[f[0]]),B=new THREE.Vector3(...X[f[1]]),D=new THREE.Vector3(...X[f[2]]);
    const n=B.clone().sub(A).cross(D.clone().sub(A)),out=n.dot(A.clone().add(B).add(D).divideScalar(3).sub(C))>=0;(out?f:[f[0],f[2],f[1]]).forEach(v=>pos.push(...X[v]))});

  return [THREE.BackSide,THREE.FrontSide].map(side=>{const m=new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:0.45,side,depthWrite:false,roughness:0.5});m.userData.T=true;return new THREE.Mesh(geo,m)})}
function placeCyl(m,a,b){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);m.position.copy(A).add(B).multiplyScalar(.5);m.scale.set(1,d.length(),1);m.quaternion.setFromUnitVectors(UP,d.normalize())}
function crystal(st,q0=null,scale=S){
  const outer=new THREE.Group(), spin=new THREE.Group(), fixed=new THREE.Group(), g=new THREE.Group(); g.scale.setScalar(scale);
  outer.add(spin); spin.add(fixed); fixed.add(g); if(q0) fixed.quaternion.set(...q0); const X=st.X, mats=[];
  X.forEach((p,j)=>{const m=new THREE.Mesh(sph,mat(COL[st.spp[j]]));m.position.set(...p);g.add(m)});
  st.bonds.forEach(([a,b])=>{const M=[(X[a][0]+X[b][0])/2,(X[a][1]+X[b][1])/2,(X[a][2]+X[b][2])/2];
    const m1=new THREE.Mesh(cyl,mat(COL[st.spp[a]])),m2=new THREE.Mesh(cyl,mat(COL[st.spp[b]]));placeCyl(m1,X[a],M);placeCyl(m2,M,X[b]);g.add(m1,m2)});
  st.polys.forEach(P=>polyMeshes(P,X,COL[st.spp[P.c]]).forEach(pm=>g.add(pm)));
  g.traverse(o=>{if(o.material)mats.push([o.material,o.material.opacity])});
  return {outer,spin,g,setOpacity:f=>mats.forEach(([m,o])=>op(m,o*f))};
}
// ---------- model boxes
const BOX=3.0, BS=1.25, boxes=[]; // BS: scale of the model boxes
function labelMat(txt){const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');g.fillStyle='#4b5563';g.font='600 140px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,512,132);
  const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:t,transparent:true})}
function modelBox(txt,y){
  const G=new THREE.Group(); G.position.set(0,y,0); G.scale.setScalar(BS); scene.add(G);
  const bm=new THREE.MeshStandardMaterial({color:'#eef1f5',roughness:0.55,metalness:0,emissive:'#2171b5',emissiveIntensity:0,transparent:true});
  G.add(new THREE.Mesh(new RoundedBoxGeometry(BOX,BOX,2.2,6,0.32),bm));
  const icon=new THREE.Group(); icon.position.z=1.11; G.add(icon);
  const nodes=[]; [3,4,3].forEach((n,li)=>{for(let k=0;k<n;k++)nodes.push({x:(li-1)*0.82,y:0.34+(k-(n-1)/2)*0.43,l:li})});
  const lm=new THREE.LineBasicMaterial({color:'#b9c1cb',transparent:true});
  nodes.forEach(a=>nodes.forEach(b=>{if(b.l===a.l+1)icon.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a.x,a.y,0),new THREE.Vector3(b.x,b.y,0)]),lm))}));

  nodes.forEach(n=>{const m=new THREE.Mesh(new THREE.CircleGeometry(0.105,32),nm);m.position.set(n.x,n.y,0.005);icon.add(m)});
  const lab=new THREE.Mesh(new THREE.PlaneGeometry(2.5,0.625),labelMat(txt)); lab.position.set(0,-0.98,0.006); icon.add(lab);

}
const YT=2.75, YB=-2.75, XIN=-7.6, XOUT=7.8;
modelBox('CSP Model',YT); modelBox('SICSP Model',YB);
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
// ---------- CSP lane: only the composition goes in
const P=DATA.csp.pred;
const looseT=P.spp.slice(0,P.n).map((s,k)=>{const m=new THREE.Mesh(sph,mat(COL[s]));m.scale.setScalar(S);scene.add(m);
  return {m,start:new THREE.Vector3(XIN-2.6+rnd()*5.2,YT-1.5+rnd()*3,-1+rnd()*2),end:new THREE.Vector3(-0.5,YT+(rnd()-.5)*1.4,(rnd()-.5)*0.6),t0:1.0+k*0.1,ph:rnd()*6.28}});

const Q=DATA.sicsp, tpl=new THREE.Group(), tg=new THREE.Group(); tg.scale.setScalar(S); tpl.add(tg); tpl.position.set(XIN,YB,0); scene.add(tpl);
const tplMats=[];
// template colour: 'gray' (neutral, like the cell), 'blue' (accent of the model boxes) or 'pastel' (species colour, lightened)
const TPL='gray', TPLC={gray:'#8b95a1',blue:'#2171b5'};
const tcol=sp=>TPL==='pastel'?new THREE.Color(COL[sp]).lerp(new THREE.Color('#ffffff'),0.5):new THREE.Color(TPLC[TPL]);
const cellMat=new THREE.LineDashedMaterial({color:TPL==='blue'?0x8fb3d9:0x9aa3ad,dashSize:0.32,gapSize:0.22,transparent:true}); tplMats.push([cellMat,1]);
const C=Q.corners; for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const d=i^j;if(d===1||d===2||d===4){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...C[i]),new THREE.Vector3(...C[j])]),cellMat);l.computeLineDistances();tg.add(l)}}
const ringGeo=new THREE.TorusGeometry(0.6,0.07,14,56);
Q.X.slice(0,Q.n).forEach((p,i)=>{if(Q.free[i])return;const m=new THREE.MeshStandardMaterial({color:tcol(Q.spp[i]),roughness:0.4,transparent:true});tplMats.push([m,0.9]);
  const r=new THREE.Mesh(ringGeo,m);r.position.set(...p);r.quaternion.copy(cam.quaternion);tg.add(r)});

const looseB=Q.spp.slice(0,Q.n).map((s,k)=>{const m=new THREE.Mesh(sph,mat(COL[s]));scene.add(m);
  const slot=new THREE.Vector3(...Q.X[k]); if(Q.free[k]) slot.addScaledVector(new THREE.Vector3(...Q.fdir[k]),(rnd()-.5)*2.2);
  return {m,start:new THREE.Vector3(XIN-2.6+rnd()*5.2,YB-1.5+rnd()*3,-1+rnd()*2).sub(tpl.position).divideScalar(S),slot,t0:1.0+k*0.1,ph:rnd()*6.28}});
looseB.forEach(a=>{tg.add(a.m)});
const outB=crystal(Q); outB.outer.position.set(XOUT,YB,0); scene.add(outB.outer);
// clip at the box walls: inputs vanish through the left wall, outputs emerge through the right one
const clipIn=[new THREE.Plane(new THREE.Vector3(-1,0,0),-BOX*BS/2)], clipOut=[new THREE.Plane(new THREE.Vector3(1,0,0),-BOX*BS/2)];
const clip=(o,c)=>o.traverse(x=>{if(x.material)x.material.clippingPlanes=c});
clip(tpl,clipIn); looseT.forEach(a=>a.m.material.clippingPlanes=clipIn); clip(outT.outer,clipOut); clip(outB.outer,clipOut);
// ---------- timeline
const T=12.0, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eo=t=>1-Math.pow(1-t,3), cl=t=>Math.min(1,Math.max(0,t));
const blue=new THREE.Color('#2171b5'), gray=new THREE.Color('#8b95a1');
let urlT=new URLSearchParams(location.search).get('t'); const t0=performance.now();
function frame(now){
  if(!VIS&&urlT===null){requestAnimationFrame(frame);return}
  const t=urlT!==null?parseFloat(urlT):((now-t0)/1000)%T;
  const fin=cl(t/0.5), fout=1-cl((t-T+0.7)/0.6), f=fin*fout;

  looseT.forEach(a=>{const u=ease(cl((t-a.t0-1.4)/1.4)),p=a.start.clone().lerp(a.end,u);p.y+=Math.sin(t*2+a.ph)*0.22*(1-u);p.z+=Math.cos(t*1.7+a.ph)*0.18*(1-u);
    a.m.position.copy(p);a.m.visible=u<1;op(a.m.material,f)});
  tplMats.forEach(([m,o])=>m.opacity=o*cl((t-0.3)/0.7)*fout);
  looseB.forEach(a=>{const u=ease(cl((t-a.t0)/1.3)),p=a.start.clone().lerp(a.slot,u);p.y+=Math.sin(t*2+a.ph)*0.4*(1-u);p.z+=Math.cos(t*1.7+a.ph)*0.3*(1-u);
    a.m.position.copy(p);op(a.m.material,f)});

}
