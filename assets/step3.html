let urlT=new URLSearchParams(location.search).get('t'); const t0=performance.now();
function frame(now){
  const t=urlT!==null?parseFloat(urlT):((now-t0)/1000)%T;
  const fout=1-cl((t-T+0.8)/0.7), z=ease(cl((t-TZ)/1.3));
  panels.forEach((P,i)=>{
    const win=i===BEST, sel=cl((t-TSEL)/0.5), dim=win?1:1-0.55*sel, gone=win?1:1-cl((t-TZ)/0.6);
    // 1. the reference appears in every panel; 2. a copy of the prediction drops in with a random orientation
    const pin=cl((t-0.15*i)/0.6), gin=eo(cl((t-0.9-0.12*i)/0.6)), bare=cl((t-1.0)/0.5)*(1-cl((t-TZ-1.0)/0.6));
    P.bgM.color.copy(WHITE).lerp(CARDC,pin*fout*gone);
    P.mats.forEach(([m,o])=>op(m,o*pin*fout*dim*gone*(m.userData.poly?1-bare:1)));
    // 3. playback of the real optimisation: matching recomputed every step, the copy turns and slides into place
    const p=cl((t-TP0)/TPL), fi=p*(NF-1), st=pose(P,fi);
    P.gmats.forEach(([m,o])=>op(m,o*gin*fout*dim*gone)); P.gh.visible=gin>0; P.gh.scale.setScalar(1+0.15*(1-gin));
    const lin=cl((t-1.7)/0.4)*fout*dim*gone;
    st.fr.pairs.forEach(([a,b],k)=>{const L=P.lines[k], A=local(P,st.X[a]), B=local(P,DATA.ref.X[b]);L.geometry.setPositions([A.x,A.y,A.z,B.x,B.y,B.z]);L.computeLineDistances();
      const key=a+','+b; if(key!==P.prev[k]&&t>TP0){P.prev[k]=key;P.flash[k]=t}
      const fl=Math.max(0,1-(t-P.flash[k])/0.5); L.material.color.copy(gray6).lerp(blue,fl); L.material.opacity=lin; L.visible=lin>0});
    P.bar.scale.x=barLen(st.rmse); P.bm.opacity=cl((t-1.7)/0.4)*fout*dim*gone; P.bm.color.copy(light).lerp(blue,win?sel:0); P.ringM.opacity=win?sel*fout:0;
    setVal(P,st.rmse,win&&sel>0.5?ACC:DARK); P.seed.set('Seed '+(i+1),win&&sel>0.5?ACC:'#6b7280'); const k=Math.min(NF-2,Math.floor(fi)), stp=Math.round(P.run[k].step+(P.run[k+1].step-P.run[k].step)*(fi-k));
    P.step.set('Step '+stp+' / 400'); P.seed.m.opacity=P.step.m.opacity=pin*fout*dim*gone; P.val.position.set(BX0+barLen(st.rmse)+0.2+1.2,-2.4,0); P.vm.opacity=P.bm.opacity;
    // 4. the best restart is kept: it moves to the centre and grows, the others leave
    if(win&&z>0){P.gmats.forEach(([m])=>m.clippingPlanes=null);P.lines.forEach(l=>l.material.clippingPlanes=null)}
    if(win){P.G.position.set(PC[i][0]*(1-z),PC[i][1]*(1-z),0);P.G.scale.setScalar(1+0.7*z)}
    P.G.visible=gone>0;
  });
  ren.render(scene,cam); if(urlT===null)requestAnimationFrame(frame);
}
window.__redraw=()=>{urlT=new URLSearchParams(location.search).get('t');frame(performance.now())};
resize(); requestAnimationFrame(frame);
</script></body></html>
