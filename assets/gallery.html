const GRAY='#6b7280', DARK='#4b5563', LIGHT='#c4cad3', ACC='#2171b5';
const dark=new THREE.Color(DARK), light=new THREE.Color(LIGHT), gray6=new THREE.Color('#6b7280'), blue=new THREE.Color(ACC);

const BY=-PH/2+0.55, BX0=-PW/2+0.4, BLEN=3.7, SY=0.35;
let cur=null, panels=[], t0=performance.now(), userQ=new THREE.Quaternion();

let CI=0;
function select(ci,auto=false){ // auto: next composition of the loop, keeps the user's rotation and the cards

  if(!auto){userQ.identity(); const r0=new URLSearchParams(location.search).get('r'); if(r0)userQ.setFromAxisAngle(new THREE.Vector3(1,1,0).normalize(),+r0)} // ?r= for screenshots

let TS=1; // label scale: larger on narrow screens, where the cards are drawn smaller
function place(){ // card positions, label sizes and the clipping planes that keep a far-away copy inside its card

    const [cx,cy]=cellC(i);P.G.position.set(cx,cy,0);P.clip=[[1,0,-(cx-PW/2+0.12)],[-1,0,cx+PW/2-0.12],[0,1,-(cy-PH/2+0.12)],[0,-1,cy+PH/2-0.12]].map(([a,b,c])=>new THREE.Plane(new THREE.Vector3(a,b,0),c));

// chips
const chips=document.getElementById('chips'), hint=chips.firstChild;
DATA.comps.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML=c.formula.replace(/(\d+)/g,'<sub>$1</sub>');b.onclick=()=>select(i);chips.insertBefore(b,hint)});
// drag to rotate every structure together
let drag=null; const QX=new THREE.Quaternion(), QY=new THREE.Quaternion(), AX=new THREE.Vector3(1,0,0), AY=new THREE.Vector3(0,1,0);
el.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];el.setPointerCapture(e.pointerId)});

['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>drag=null));
// ---------- timeline after each selection: cards and references, copies drop in, real alignment playback, best value
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eo=t=>1-Math.pow(1-t,3), cl=t=>Math.min(1,Math.max(0,t));
const WHITE=new THREE.Color('#ffffff'), CARDC=new THREE.Color('#eef1f5');
const TP0=1.5, TPL=5.5, TEND=TP0+TPL, TSEL=TEND+0.3, TLOOP=TSEL+4.5; // the result is held, faded out, and the alignment replays
let loop=0;
const qa=new THREE.Quaternion(), qb=new THREE.Quaternion(), va=new THREE.Vector3(), vb=new THREE.Vector3(), cT=new THREE.Color();
let urlT=new URLSearchParams(location.search).get('t');
function frame(now){
  if(!VIS&&urlT===null){requestAnimationFrame(frame);return}
